# Launch profiles — edit `command` to match your setup.
#
# The backend runs each command as a subprocess in its own process group
# so Ctrl+C / stop actions cleanly kill the entire roslaunch tree.
#
# Tips:
#   - Prefer `ros2 launch` with a specific package + file over `bash -c` chains.
#   - Source your workspace in run.sh (not here) so the env is inherited.
#   - If you need to pass launch args, just append them:
#       ros2 launch my_pkg main.launch.py use_sim_time:=false namespace:=robot1

profiles:
  timesync:
    # 헤드리스 — 별도 창 안 뜸. zellij 시각화 빠진 ptp4l + phc2sys.
    # offset 값은 backend log buffer로 흘러감 (1초 간격).
    # thor 사용자 기준 sudo 불필요.
    command: "/bin/bash /home/thor/inha_scripts/default/timesync_headless.sh"
    description: "PTP time sync (THOR master ↔ ORIN slave)"

  bag_record:
    command: "/bin/bash /home/thor/inha_scripts/default/bag_record_headless.sh"
    description: "Remote rosbag recorder for BT mission runs"
    stop_grace_sec: 40.0
    stop_term_sec: 8.0

  bringup_common:
    command: "/bin/bash /home/thor/inha_scripts/default/bringup_with_common_headless.sh"
    description: "Common robot bringup stack"
    strict_stop: true
    stop_grace_sec: 20.0
    stop_term_sec: 6.0

